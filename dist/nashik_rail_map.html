<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAILअंदाज • Live Nashik City Rail GIS Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0B192C; color: #F8FAFC; }
        
        #map-container { width: 100%; height: 100%; position: relative; }
        #gmap, #fallback-map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* Floating Top Control HUD */
        .hud-top {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(11, 25, 44, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 10px 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.36);
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .brand-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-accent { color: #10B981; }
        .live-tag {
            background: rgba(16, 185, 129, 0.16);
            color: #10B981;
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10B981;
            animation: pulse-ring 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }

        /* Viewport Presets Bar */
        .preset-buttons {
            display: flex;
            gap: 6px;
        }
        .btn-preset {
            background: rgba(30, 41, 59, 0.85);
            color: #E2E8F0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-preset:hover {
            background: #10B981;
            color: #0B192C;
            border-color: #10B981;
        }
        .btn-preset.active {
            background: #10B981;
            color: #0B192C;
            font-weight: 700;
        }

        /* Floating Telemetry & Legend Panel */
        .hud-bottom {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .hud-legend {
            background: rgba(11, 25, 44, 0.94);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.36);
            pointer-events: auto;
            max-width: 380px;
        }
        .legend-title {
            font-size: 12px;
            font-weight: 700;
            color: #94A3B8;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .legend-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 11px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #E2E8F0;
        }
        .legend-color-bar {
            width: 14px;
            height: 4px;
            border-radius: 2px;
        }
        .legend-symbol {
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="map-container">
        <!-- Google Map canvas & interactive vector fallback -->
        <div id="gmap" style="display:none;"></div>
        <div id="fallback-map"></div>

        <!-- Top Control HUD -->
        <div class="hud-top">
            <div class="hud-card">
                <div class="brand-title">
                    <span>🚆</span>
                    <span>RAIL<span class="brand-accent">अंदाज</span></span>
                </div>
                <div class="live-tag">
                    <div class="pulse-dot"></div>
                    <span>LIVE NASHIK RADAR</span>
                </div>
                <div id="clock-display" style="font-family:'JetBrains Mono',monospace; font-size:12px; color:#94A3B8;">--:--:-- IST</div>
            </div>

            <div class="hud-card preset-buttons">
                <button class="btn-preset active" onclick="focusViewport('NASHIK_ROAD')">🎯 Nashik Road (NK)</button>
                <button class="btn-preset" onclick="focusViewport('DEVLALI')">🎖️ Devlali (DVL)</button>
                <button class="btn-preset" onclick="focusViewport('BRIDGE')">🌉 Godavari Bridge</button>
                <button class="btn-preset" onclick="focusViewport('CORRIDOR')">🗺️ Full Corridor</button>
            </div>
        </div>

        <!-- Bottom Left Telemetry & Legend HUD -->
        <div class="hud-bottom">
            <div class="hud-legend">
                <div class="legend-title">
                    <span>Central Railway Corridor</span>
                    <span style="color:#10B981;" id="active-trains-count">6 Trains Active</span>
                </div>
                <div class="legend-grid">
                    <div class="legend-item">
                        <div class="legend-color-bar" style="background:#10B981;"></div>
                        <span>Clear (Auto Block)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color-bar" style="background:#F59E0B;"></div>
                        <span>Caution / Regulated</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color-bar" style="background:#EF4444;"></div>
                        <span>High Saturation</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-symbol">🏢</span>
                        <span>Stations (12)</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-symbol">⚡</span>
                        <span>25kV AC Electrified</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-symbol">📡</span>
                        <span>ISRO RTIS Transponder</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet library for zero-config offline / standalone interactive mapping -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Standalone pre-bundled Railway GIS Data for Nashik City Corridor
        const rawData = {
            "stations": [
                {"code":"IGP","name":"Igatpuri","marathiName":"इगतपुरी","lat":19.6983,"lng":73.5654,"elevation":600,"platforms":4,"isJunction":true,"category":"NSG-3","tracks":6,"description":"Thal Ghat summit station with locomotive reversal and banking sidings.","features":["Banking Loco Attachment","Brake Testing","Crew Lobby"]},
                {"code":"GO","name":"Ghoti","marathiName":"घोटी","lat":19.7214,"lng":73.6543,"elevation":590,"platforms":2,"isJunction":false,"category":"NSG-6","tracks":3,"description":"Rural wayside crossing station.","features":["Passing Loop"]},
                {"code":"ASO","name":"Asavali","marathiName":"आसावली","lat":19.7820,"lng":73.7120,"elevation":582,"platforms":2,"isJunction":false,"category":"NSG-6","tracks":3,"description":"Intermediate block station.","features":["Goods Siding"]},
                {"code":"LT","name":"Lahavit","marathiName":"लहावीत","lat":19.8250,"lng":73.7460,"elevation":575,"platforms":2,"isJunction":false,"category":"NSG-6","tracks":3,"description":"Wayside station with automatic block signal overlap.","features":["Automatic Signal"]},
                {"code":"DVL","name":"Devlali","marathiName":"देवळाली","lat":19.9242,"lng":73.8310,"elevation":570,"platforms":3,"isJunction":false,"category":"NSG-4","tracks":5,"description":"Military cantonment station with Army School of Artillery sidings & Kisan Rail docks.","features":["Military Siding","Kisan Rail Hub"]},
                {"code":"NK","name":"Nashik Road","marathiName":"नाशिक रोड","lat":19.9575,"lng":73.8340,"elevation":565,"platforms":4,"isJunction":false,"category":"NSG-2","tracks":7,"description":"Primary passenger hub serving Nashik Metropolitan City. 4 high-level platforms, automatic block interlocking.","features":["Kumbh Mela Concourse","Automatic Signalling","Pit Line"]},
                {"code":"ODH","name":"Odha","marathiName":"ओढा","lat":20.0210,"lng":73.9110,"elevation":560,"platforms":2,"isJunction":false,"category":"NSG-5","tracks":4,"description":"Godavari River Bridge approach zone bottleneck.","features":["Godavari Major Bridge 214/1","Caution 30 km/h"]},
                {"code":"KW","name":"Kherwadi","marathiName":"खेरवाडी","lat":20.0780,"lng":73.9780,"elevation":555,"platforms":2,"isJunction":false,"category":"NSG-6","tracks":3,"description":"Agricultural crossing station between Odha and Niphad.","features":["Loop Line"]},
                {"code":"KBSN","name":"Kasbe Sukene","marathiName":"कसबे सुकेणे","lat":20.1250,"lng":74.0320,"elevation":550,"platforms":2,"isJunction":false,"category":"NSG-6","tracks":3,"description":"Vineyard belt station handling agro rakes.","features":["Goods Loop"]},
                {"code":"NR","name":"Niphad","marathiName":"निफाड","lat":20.0864,"lng":74.1086,"elevation":548,"platforms":3,"isJunction":false,"category":"NSG-5","tracks":4,"description":"Major agro-industrial station for onion and wheat transport.","features":["Agro Terminal","Platform 1-3"]},
                {"code":"LS","name":"Lasalgaon","marathiName":"लासलगाव","lat":20.1448,"lng":74.2389,"elevation":545,"platforms":3,"isJunction":false,"category":"NSG-4","tracks":5,"description":"Asia's biggest onion wholesale market hub with freight railhead.","features":["Onion Railhead","BOXN Rake Siding"]},
                {"code":"MMR","name":"Manmad Junction","marathiName":"मनमाड जंक्शन","lat":20.2520,"lng":74.4370,"elevation":580,"platforms":6,"isJunction":true,"category":"NSG-3","tracks":12,"description":"Central Railway mega-junction linking Mumbai-Howrah, Mumbai-Delhi, and SCR.","features":["6 Platforms","IOCL Siding","Trip Shed"]}
            ],
            "sections": [
                {"sectionId":"SEC-IGP-DVL","name":"Igatpuri - Devlali Mainline","lengthKm":35.8,"trackType":"Double Electrified (25kV AC)","signaling":"ABSOLUTE_BLOCK","maxSpeed":110,"saturation":78,"signalAspect":"GREEN (Proceed)","status":"CLEAR","path":[{"lat":19.6983,"lng":73.5654},{"lat":19.7214,"lng":73.6543},{"lat":19.7820,"lng":73.7120},{"lat":19.8250,"lng":73.7460},{"lat":19.9242,"lng":73.8310}]},
                {"sectionId":"SEC-DVL-NK","name":"Devlali - Nashik Road Urban Sector","lengthKm":4.8,"trackType":"Double Electrified + Loop Lines","signaling":"AUTOMATIC_BLOCK","maxSpeed":110,"saturation":92,"signalAspect":"DOUBLE_YELLOW (Attention)","status":"OCCUPIED","path":[{"lat":19.9242,"lng":73.8310},{"lat":19.9390,"lng":73.8325},{"lat":19.9575,"lng":73.8340}]},
                {"sectionId":"SEC-NK-ODH","name":"Nashik Road - Odha (Godavari Crossing)","lengthKm":10.2,"trackType":"Double Electrified Mainline","signaling":"AUTOMATIC_BLOCK","maxSpeed":100,"saturation":88,"signalAspect":"YELLOW (Caution)","status":"CAUTION","path":[{"lat":19.9575,"lng":73.8340},{"lat":19.9790,"lng":73.8580},{"lat":19.9950,"lng":73.8820},{"lat":20.0210,"lng":73.9110}]},
                {"sectionId":"SEC-ODH-KW","name":"Odha - Kherwadi Agricultural Segment","lengthKm":8.5,"trackType":"Double Electrified Mainline","signaling":"AUTOMATIC_BLOCK","maxSpeed":110,"saturation":64,"signalAspect":"GREEN (Proceed)","status":"CLEAR","path":[{"lat":20.0210,"lng":73.9110},{"lat":20.0510,"lng":73.9450},{"lat":20.0780,"lng":73.9780}]},
                {"sectionId":"SEC-KW-KBSN","name":"Kherwadi - Kasbe Sukene Segment","lengthKm":7.2,"trackType":"Double Electrified Mainline","signaling":"ABSOLUTE_BLOCK","maxSpeed":110,"saturation":70,"signalAspect":"GREEN (Proceed)","status":"CLEAR","path":[{"lat":20.0780,"lng":73.9780},{"lat":20.1010,"lng":74.0050},{"lat":20.1250,"lng":74.0320}]},
                {"sectionId":"SEC-KBSN-NR","name":"Kasbe Sukene - Niphad Agro Line","lengthKm":8.6,"trackType":"Double Electrified Mainline","signaling":"ABSOLUTE_BLOCK","maxSpeed":120,"saturation":74,"signalAspect":"GREEN (Proceed)","status":"CLEAR","path":[{"lat":20.1250,"lng":74.0320},{"lat":20.1050,"lng":74.0700},{"lat":20.0864,"lng":74.1086}]},
                {"sectionId":"SEC-NR-LS","name":"Niphad - Lasalgaon Onion Corridor","lengthKm":14.1,"trackType":"Double Electrified Mainline","signaling":"ABSOLUTE_BLOCK","maxSpeed":120,"saturation":82,"signalAspect":"GREEN (Proceed)","status":"CLEAR","path":[{"lat":20.0864,"lng":74.1086},{"lat":20.1150,"lng":74.1730},{"lat":20.1448,"lng":74.2389}]},
                {"sectionId":"SEC-LS-MMR","name":"Lasalgaon - Manmad Junction Approach","lengthKm":25.3,"trackType":"Double Electrified + Yard Approaches","signaling":"ABSOLUTE_BLOCK","maxSpeed":110,"saturation":94,"signalAspect":"DOUBLE_YELLOW (Attention)","status":"CAUTION","path":[{"lat":20.1448,"lng":74.2389},{"lat":20.1980,"lng":74.3380},{"lat":20.2520,"lng":74.4370}]}
            ],
            "trains": [
                {"trainNumber":"12109","name":"Panchavati Express","type":"Superfast Intercity","locomotive":"WAP-7 #30482 (KYN Shed)","lat":19.9540,"lng":73.8335,"speed":44,"delay":12,"nextStation":"NK","eta":"18:42","priority":2,"statusText":"Decelerating on home signal for Nashik Road PF-2. Speed 44 km/h."},
                {"trainNumber":"22223","name":"CSMT - Shirdi Vande Bharat","type":"Vande Bharat Express","locomotive":"Train-18 EMU Rake #14","lat":19.9120,"lng":73.8240,"speed":108,"delay":0,"nextStation":"DVL","eta":"18:50","priority":1,"statusText":"Cruising at top speed 108 km/h. Clear green aspect in block section."},
                {"trainNumber":"12137","name":"Punjab Mail","type":"Superfast Mail","locomotive":"WAP-7 #30211 (GZB Shed)","lat":20.0050,"lng":73.8950,"speed":28,"delay":8,"nextStation":"ODH","eta":"19:04","priority":2,"statusText":"Regulating over Godavari bridge caution zone at 28 km/h."},
                {"trainNumber":"12859","name":"Gitanjali Express","type":"Superfast Express","locomotive":"WAP-7 #37019 (SRC Shed)","lat":20.0890,"lng":74.1120,"speed":104,"delay":22,"nextStation":"NR","eta":"19:15","priority":2,"statusText":"Accelerating past Niphad agro zone. Right time run attempt."},
                {"trainNumber":"BOXN-78","name":"Lasalgaon Agro Freight","type":"Freight (BOXNHL Rake)","locomotive":"WAG-9HC #31890 (BSL Shed)","lat":20.1460,"lng":74.2410,"speed":0,"delay":45,"nextStation":"LS","eta":"Loading","priority":3,"statusText":"Stationary at Lasalgaon freight siding 3. Rake loading underway."},
                {"trainNumber":"BTPN-42","name":"HPCL Manmad POL Tanker","type":"Freight (BTPN Tanker)","locomotive":"Twin WAG-9 #32104 (AQ Shed)","lat":20.1245,"lng":74.0315,"speed":32,"delay":15,"nextStation":"KBSN","eta":"19:12","priority":3,"statusText":"Regulated on loop line to give precedence to Vande Bharat."}
            ]
        };

        const VIEWPORTS = {
            NASHIK_ROAD: { lat: 19.9575, lng: 73.8340, zoom: 14 },
            DEVLALI: { lat: 19.9242, lng: 73.8310, zoom: 14 },
            BRIDGE: { lat: 20.0050, lng: 73.8950, zoom: 14 },
            CORRIDOR: { lat: 19.9700, lng: 73.9500, zoom: 10 }
        };

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Kolkata', hour12: false }) + ' IST';
            document.getElementById('clock-display').innerText = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        let leafletMap = null;
        function initMap() {
            leafletMap = L.map('fallback-map', { zoomControl: true }).setView([19.9575, 73.8340], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors | Central Railway GIS'
            }).addTo(leafletMap);

            // Draw Sections
            rawData.sections.forEach(sec => {
                const color = sec.status === 'CLEAR' ? '#10B981' : (sec.status === 'CAUTION' ? '#F59E0B' : '#EF4444');
                const latLngs = sec.path.map(p => [p.lat, p.lng]);
                const polyline = L.polyline(latLngs, { color: color, weight: 5, opacity: 0.9 }).addTo(leafletMap);
                polyline.bindPopup(
                    '<div style="color:#0F172A; font-family:\'Outfit\',sans-serif;">' +
                    '<strong>' + sec.name + '</strong><br/>' +
                    'Length: <b>' + sec.lengthKm + ' km</b> | Max Speed: <b>' + sec.maxSpeed + ' km/h</b><br/>' +
                    'Status: <b style="color:' + color + '">' + sec.status + ' (' + sec.signalAspect + ')</b>' +
                    '</div>'
                );
            });

            // Draw Stations
            rawData.stations.forEach(stn => {
                const marker = L.circleMarker([stn.lat, stn.lng], {
                    radius: stn.code === 'NK' ? 9 : 6,
                    fillColor: stn.code === 'NK' ? '#10B981' : '#0B192C',
                    color: '#FFFFFF',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.95
                }).addTo(leafletMap);

                marker.bindPopup(
                    '<div style="color:#0F172A; font-family:\'Outfit\',sans-serif;">' +
                    '<strong>' + stn.name + ' (' + stn.code + ')</strong> - <b>' + stn.marathiName + '</b><br/>' +
                    'Platforms: <b>' + stn.platforms + '</b> | Category: <b>' + stn.category + '</b><br/>' +
                    '<small>' + stn.description + '</small>' +
                    '</div>'
                );
            });

            // Draw Trains
            rawData.trains.forEach(t => {
                const trainMarker = L.circleMarker([t.lat, t.lng], {
                    radius: 8,
                    fillColor: t.priority === 1 ? '#2563EB' : '#EF4444',
                    color: '#FFFFFF',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 1
                }).addTo(leafletMap);

                trainMarker.bindPopup(
                    '<div style="color:#0F172A; font-family:\'Outfit\',sans-serif;">' +
                    '<strong>🚆 ' + t.trainNumber + ' - ' + t.name + '</strong><br/>' +
                    'Speed: <b>' + t.speed + ' km/h</b> | Delay: <b>' + (t.delay === 0 ? 'ON TIME' : '+' + t.delay + 'm') + '</b><br/>' +
                    'Next: <b>' + t.nextStation + ' (ETA: ' + t.eta + ')</b><br/>' +
                    '<small>' + t.statusText + '</small>' +
                    '</div>'
                );
            });
        }

        function focusViewport(presetKey) {
            document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            const vp = VIEWPORTS[presetKey];
            if (vp && leafletMap) {
                leafletMap.setView([vp.lat, vp.lng], vp.zoom);
            }
        }

        window.onload = initMap;
    </script>
</body>
</html>
